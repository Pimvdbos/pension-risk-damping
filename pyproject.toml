[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pension-risk-damping"
version = "0.1.0"
description = "Academic reconstruction of SPR pension damping experiments under the Dutch Wtp"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Pim van den Bos"}]
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "python-calamine>=0.3,<1"]

[project.optional-dependencies]
dev = ["matplotlib>=3.9,<4", "nbformat>=5.10,<6", "pytest>=8,<10", "ipykernel>=6.29,<8"]

[project.scripts]
pension-risk = "pension_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
