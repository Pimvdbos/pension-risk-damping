name: Software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts
      - run: python scripts/plot_reported_results.py
      - run: python scripts/plot_replicated_results.py
      - run: python -m pension_risk.cli analyze --help
      - run: python scripts/audit_replication.py --help
